name: Historical news backfill (GDELT)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'UTC start date (YYYY-MM-DD)'
        required: true
        default: '2020-01-01'
      end_date:
        description: 'UTC end date (YYYY-MM-DD)'
        required: true
        default: '2026-08-21'
      window_days:
        description: 'Initial query window; automatically split when needed'
        required: true
        default: '30'

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market_rebound_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Backfill GDELT
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          WINDOW_DAYS: ${{ inputs.window_days }}
        run: |
          python src/gdelt_backfill_runner.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --window-days "$WINDOW_DAYS" \
            --out results/news_gdelt_raw.csv
      - name: Validate output
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'results/news_gdelt_raw.csv'
          d = pd.read_csv(p)
          required = ['published_at','symbol','headline','source','url']
          missing = [c for c in required if c not in d.columns]
          if missing:
              raise SystemExit(f'Missing columns: {missing}')
          if d.empty:
              raise SystemExit('GDELT backfill produced no articles')
          expected = {'STLAM.MI','SPCX','NVDA','TSLA'}
          missing_symbols = expected - set(d['symbol'].dropna().unique())
          if missing_symbols:
              raise SystemExit(f'Missing symbols: {sorted(missing_symbols)}')
          print(f'VALIDATED rows={len(d)} symbols={sorted(d.symbol.unique())}')
          print(d.groupby('symbol').size().to_string())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gdelt-news-raw
          path: |
            market_rebound_model/results/news_gdelt_raw.csv
            market_rebound_model/results/news_gdelt_raw.csv.checkpoint.csv
