name: News V3 secondary ranking

on:
  push:
    paths:
      - 'market_rebound_model/src/news_event_secondary_ranking.py'
      - 'market_rebound_model/tests/test_news_event_secondary_ranking.py'
      - '.github/workflows/news-v3-secondary-ranking.yml'
  workflow_dispatch:

jobs:
  ranking:
    name: OOS secondary news ranking
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: market_rebound_model
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run deterministic ranking tests
        run: python -m pytest -q tests/test_news_event_secondary_ranking.py

      - name: Find latest usable walk-forward artifact
        id: wf_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/news-v3-event-walkforward-filter.yml/runs?status=success&per_page=20" \
            --jq '.workflow_runs[0].id')
          test -n "$run_id" && test "$run_id" != "null"
          artifact_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="news-v3-event-walkforward-filter") | .id' | head -n1)
          test -n "$artifact_id"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Find latest historical artifact with raw GKG
        id: hist_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/news-v2-historical-backfill.yml/runs?status=success&per_page=20" \
            --jq '.workflow_runs[0].id')
          test -n "$run_id" && test "$run_id" != "null"
          artifact_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="news-v3-event-aware-historical-final") | .id' | head -n1)
          test -n "$artifact_id"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download ranking input
        env:
          GH_TOKEN: ${{ github.token }}
          WF_ARTIFACT_ID: ${{ steps.wf_artifact.outputs.artifact_id }}
          HIST_ARTIFACT_ID: ${{ steps.hist_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p results/imported/wf results/imported/hist
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${WF_ARTIFACT_ID}/zip" > /tmp/ranking.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HIST_ARTIFACT_ID}/zip" > /tmp/history.zip
          unzip -q /tmp/ranking.zip -d results/imported/wf
          unzip -q /tmp/history.zip -d results/imported/hist
          rows=$(find results/imported/wf -type f -name 'news_v3_event_walkforward_filter_rows.csv' -print -quit)
          raw=$(find results/imported/hist -type f -name 'news_v2_full_raw.csv' -print -quit)
          test -n "$rows"
          test -n "$raw"
          cp "$rows" results/news_v3_event_walkforward_filter_rows.csv
          cp "$raw" results/news_v2_full_raw.csv
          test -s results/news_v3_event_walkforward_filter_rows.csv
          test -s results/news_v2_full_raw.csv

      - name: Run normal OOS secondary ranking
        run: |
          python src/news_event_secondary_ranking.py \
            results/news_v3_event_walkforward_filter_rows.csv \
            --raw-gkg results/news_v2_full_raw.csv \
            --out results/news_v3_secondary_ranking.csv \
            --min-n 20 \
            --shrink-k 50

      - name: Run inverted-score direction check
        run: |
          python src/news_event_secondary_ranking.py \
            results/news_v3_event_walkforward_filter_rows.csv \
            --raw-gkg results/news_v2_full_raw.csv \
            --out results/news_v3_secondary_ranking_inverted.csv \
            --min-n 20 \
            --shrink-k 50 \
            --invert-score

      - name: Validate ranking outputs
        run: |
          python - <<'PY'
          import pandas as pd

          report = pd.read_csv('results/news_v3_secondary_ranking.csv')
          q = pd.read_csv('results/news_v3_secondary_ranking_quartiles.csv')
          rows = pd.read_csv('results/news_v3_secondary_ranking_rows.csv')
          inv_report = pd.read_csv('results/news_v3_secondary_ranking_inverted.csv')
          inv_q = pd.read_csv('results/news_v3_secondary_ranking_inverted_quartiles.csv')
          inv_rows = pd.read_csv('results/news_v3_secondary_ranking_inverted_rows.csv')

          required_report = {'symbol','n','spearman_score_next_ret','multi_candidate_days','rank1_days','known_event_rate'}
          required_rows = {'Date','symbol','next_ret','news_rank_score','news_daily_rank','news_daily_candidates','news_rank_known_events'}
          for name, d in [('normal report', report), ('inverted report', inv_report)]:
              if not required_report.issubset(d.columns):
                  raise SystemExit(f'Invalid {name} schema')
          for name, d in [('normal rows', rows), ('inverted rows', inv_rows)]:
              if not required_rows.issubset(d.columns):
                  raise SystemExit(f'Invalid {name} schema')
              if d.empty or not d['news_daily_rank'].ge(1).all() or not d['news_daily_rank'].le(d['news_daily_candidates']).all():
                  raise SystemExit(f'Invalid {name} ranking')
              if not (d['news_rank_known_events'] > 0).any():
                  raise SystemExit(f'No known-event scores in {name}')

          merged = rows[['Date','symbol','news_rank_score']].merge(
              inv_rows[['Date','symbol','news_rank_score']], on=['Date','symbol'], suffixes=('_normal','_inverted')
          )
          if not (merged['news_rank_score_inverted'].eq(-merged['news_rank_score_normal'])).all():
              raise SystemExit('Inverted score is not an exact sign flip')

          print('SECONDARY NEWS RANKING PASS')
          print('NORMAL')
          print(report.to_string(index=False))
          print(q.to_string(index=False))
          print('INVERTED')
          print(inv_report.to_string(index=False))
          print(inv_q.to_string(index=False))
          PY

      - name: Upload ranking artifacts
        uses: actions/upload-artifact@v4
        with:
          name: news-v3-secondary-ranking
          path: |
            market_rebound_model/results/news_v3_secondary_ranking.csv
            market_rebound_model/results/news_v3_secondary_ranking_quartiles.csv
            market_rebound_model/results/news_v3_secondary_ranking_rows.csv
            market_rebound_model/results/news_v3_secondary_ranking_inverted.csv
            market_rebound_model/results/news_v3_secondary_ranking_inverted_quartiles.csv
            market_rebound_model/results/news_v3_secondary_ranking_inverted_rows.csv
          if-no-files-found: error
