name: News V3 lag1 earnings incremental

on:
  workflow_dispatch:

jobs:
  earnings-incremental:
    name: Prior-day earnings -> next session incremental
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: market_rebound_model
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Find latest usable walk-forward artifact
        id: wf_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/news-v3-event-walkforward-filter.yml/runs?status=success&per_page=20" \
            --jq '.workflow_runs[0].id')
          test -n "$run_id" && test "$run_id" != null
          artifact_id=$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="news-v3-event-walkforward-filter") | .id' | head -n1)
          test -n "$artifact_id"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Find latest historical artifact with raw GKG
        id: hist_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/news-v2-historical-backfill.yml/runs?status=success&per_page=20" \
            --jq '.workflow_runs[0].id')
          test -n "$run_id" && test "$run_id" != null
          artifact_id=$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="news-v3-event-aware-historical-final") | .id' | head -n1)
          test -n "$artifact_id"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download earnings test inputs
        env:
          GH_TOKEN: ${{ github.token }}
          WF_ARTIFACT_ID: ${{ steps.wf_artifact.outputs.artifact_id }}
          HIST_ARTIFACT_ID: ${{ steps.hist_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p results/imported/wf results/imported/hist
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${WF_ARTIFACT_ID}/zip" > /tmp/ranking.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HIST_ARTIFACT_ID}/zip" > /tmp/history.zip
          unzip -q /tmp/ranking.zip -d results/imported/wf
          unzip -q /tmp/history.zip -d results/imported/hist
          rows=$(find results/imported/wf -type f -name 'news_v3_event_walkforward_filter_rows.csv' -print -quit)
          raw=$(find results/imported/hist -type f -name 'news_v2_full_raw.csv' -print -quit)
          test -n "$rows"
          test -n "$raw"
          cp "$rows" results/news_v3_event_walkforward_filter_rows.csv
          cp "$raw" results/news_v2_full_raw.csv
          test -s results/news_v3_event_walkforward_filter_rows.csv
          test -s results/news_v2_full_raw.csv

      - name: Run earnings-only incremental value
        run: |
          python src/news_v3_lag1_earnings_incremental.py \
            results/news_v3_event_walkforward_filter_rows.csv \
            results/news_v2_full_raw.csv \
            --out results/news_v3_lag1_earnings_incremental.csv \
            --out-rows results/news_v3_lag1_earnings_incremental_rows.csv \
            --out-stability results/news_v3_lag1_earnings_stability.csv \
            --min-history 20 \
            --shrink-k 50 \
            --n-boot 10000 \
            --cost-bps 20

      - name: Validate earnings-only incremental value
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          iv = pd.read_csv('results/news_v3_lag1_earnings_incremental.csv')
          st = pd.read_csv('results/news_v3_lag1_earnings_stability.csv')
          required = {'set','n_base','n_news_candidates','n_eligible','n_selected','mean_base','mean_selected_gross','mean_selected_net','delta_mean','ci_low','ci_high','cost_bps','status'}
          if not required.issubset(iv.columns) or iv.empty:
              raise SystemExit('Invalid earnings incremental schema')
          numeric = iv[['n_base','n_news_candidates','n_eligible','n_selected','mean_base','mean_selected_gross','mean_selected_net','delta_mean','ci_low','ci_high','cost_bps']].apply(pd.to_numeric, errors='coerce')
          if numeric.isna().any().any():
              raise SystemExit('Invalid earnings incremental numeric result')
          if not iv['n_selected'].ge(0).all() or not iv['n_selected'].le(iv['n_eligible']).all() or (iv['ci_low'] > iv['ci_high']).any():
              raise SystemExit('Invalid earnings incremental counts or CI')
          if not {'symbol','year','filter','n_base','n_selected','mean_base','mean_selected_gross','delta_mean','status'}.issubset(st.columns) or st.empty:
              raise SystemExit('Invalid earnings stability schema')
          if not st['filter'].isin(['earnings_top25','earnings_top50']).all():
              raise SystemExit('Invalid earnings stability filter')
          ok = st[st['status'].eq('OK')]
          if not ok.empty and ok[['n_base','n_selected','mean_base','mean_selected_gross','delta_mean']].apply(pd.to_numeric, errors='coerce').isna().any().any():
              raise SystemExit('Invalid earnings stability numeric result')
          if not st['n_selected'].ge(0).all() or not st['n_selected'].le(st['n_base']).all():
              raise SystemExit('Invalid earnings stability counts')
          print('NEWS V3 LAG1 EARNINGS INCREMENTAL PASS')
          print(iv.to_string(index=False))
          print('NEWS V3 LAG1 EARNINGS STABILITY PASS')
          print(st.to_string(index=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: news-v3-lag1-earnings-incremental
          path: |
            market_rebound_model/results/news_v3_lag1_earnings_incremental.csv
            market_rebound_model/results/news_v3_lag1_earnings_incremental_rows.csv
            market_rebound_model/results/news_v3_lag1_earnings_stability.csv
          if-no-files-found: error
