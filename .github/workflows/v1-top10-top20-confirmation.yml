name: V1 top10 vs top20 confirmation

on:
  workflow_dispatch:

jobs:
  top1020-confirmation:
    name: Walk-forward V1 top10 vs top20 confirmation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: market_rebound_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run top10 vs top20 confirmation
        run: |
          python src/v1_threshold1020_confirmation.py \
            --out results/v1_top10_top20_confirmation.csv \
            --out-stability results/v1_top10_top20_confirmation_stability.csv \
            --n-boot 10000
      - name: Validate top10 vs top20 confirmation
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          p='results/v1_top10_top20_confirmation.csv'; s='results/v1_top10_top20_confirmation_stability.csv'
          d=pd.read_csv(p); st=pd.read_csv(s)
          req={'symbol','comparison','n_baseline','n_selected','mean_selected_gross','mean_selected_net','ci_low','ci_high','cost_bps','status'}
          if not req.issubset(d.columns) or d.empty: raise SystemExit('Invalid top10/top20 schema')
          if not set(d.comparison).issubset({'top10','top20','top10_minus_top20'}): raise SystemExit('Unexpected top10/top20 comparison')
          if (d.n_selected > d.n_baseline).any(): raise SystemExit('Invalid top10/top20 counts')
          ok=d[d.status.eq('OK')]
          nums=['n_baseline','n_selected','mean_selected_gross','mean_selected_net','ci_low','ci_high','cost_bps']
          if not ok.empty and not np.isfinite(ok[nums].to_numpy(float)).all(): raise SystemExit('Invalid top10/top20 numeric result')
          req_st={'symbol','year','comparison','n_baseline','n_selected','mean_baseline','mean_selected_gross','delta_mean'}
          if not req_st.issubset(st.columns): raise SystemExit('Invalid top10/top20 stability schema')
          print('V1 TOP10 VS TOP20 CONFIRMATION PASS'); print(d.to_string(index=False)); print('V1 TOP10 VS TOP20 STABILITY PASS'); print(st.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v1-top10-top20-confirmation
          path: |
            market_rebound_model/results/v1_top10_top20_confirmation.csv
            market_rebound_model/results/v1_top10_top20_confirmation_stability.csv
          if-no-files-found: error
