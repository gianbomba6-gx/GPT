name: News pipeline smoke test

on:
  push:
    paths:
      - 'market_rebound_model/src/gdelt_news.py'
      - 'market_rebound_model/src/gkg_historical_news.py'
      - 'market_rebound_model/src/news_provider.py'
      - 'market_rebound_model/src/news_event_classifier.py'
      - 'market_rebound_model/tests/test_gdelt_news.py'
      - 'market_rebound_model/tests/test_gkg_historical_news.py'
      - 'market_rebound_model/tests/test_news_event_classifier.py'
      - 'market_rebound_model/requirements.txt'
      - '.github/workflows/news-pipeline-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market_rebound_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Deterministic provider and feature tests
        run: python -m pytest -q tests/test_gdelt_news.py tests/test_gkg_historical_news.py tests/test_news_event_classifier.py
      - name: Live historical GKG smoke test
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from src.gkg_historical_news import GkgHistoricalProvider

          # One day's coverage can legitimately contain no matching company.
          # Use a confirmed recent week and require at least one match overall.
          end_day = date(2026, 8, 19)
          start_day = end_day - timedelta(days=6)
          provider = GkgHistoricalProvider(timeout=90)
          totals = {symbol: 0 for symbol in ["STLAM.MI", "SPCX", "NVDA", "TSLA"]}
          for day_offset in range(7):
              day = start_day + timedelta(days=day_offset)
              for symbol in totals:
                  df = provider.fetch_day(symbol, day)
                  totals[symbol] += len(df)
          print(f"GKG SMOKE RANGE: {start_day}..{end_day}")
          for symbol, count in totals.items():
              print(f"GKG {symbol}: {count} articles")
          total = sum(totals.values())
          if total <= 0:
              raise SystemExit("GDELT GKG returned zero matching articles across confirmed 7-day window")
          print(f"GKG SMOKE PASS: total={total}")
          PY
