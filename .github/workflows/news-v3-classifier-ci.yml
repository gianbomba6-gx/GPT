name: News V3 classifier CI

on:
  push:
    paths:
      - 'market_rebound_model/src/news_event_classifier.py'
      - 'market_rebound_model/tests/test_news_event_classifier.py'
      - '.github/workflows/news-v3-classifier-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market_rebound_model
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run classifier tests
        run: python -m pytest -q tests/test_news_event_classifier.py
