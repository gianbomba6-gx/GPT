name: News V3 veto bootstrap

on:
  push:
    paths:
      - 'market_rebound_model/src/news_veto_bootstrap.py'
      - 'market_rebound_model/tests/test_news_veto_bootstrap.py'
      - '.github/workflows/news-v3-veto-bootstrap.yml'
  workflow_dispatch:

jobs:
  bootstrap:
    name: Bootstrap OOS event veto
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: market_rebound_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q tests/test_news_veto_bootstrap.py
      - name: Find latest veto-filter artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/news-v3-event-walkforward-filter.yml/runs?status=success&per_page=20" \
            --jq '.workflow_runs[0].id')
          test -n "$run_id" && test "$run_id" != null
          artifact_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="news-v3-event-walkforward-filter") | .id' | head -n1)
          test -n "$artifact_id"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Download rows artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p results/imported
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/veto.zip
          unzip -q /tmp/veto.zip -d results/imported
          rows=$(find results/imported -type f -name 'news_v3_event_walkforward_filter_rows.csv' -print -quit)
          test -n "$rows"
          cp "$rows" results/news_v3_event_walkforward_filter_rows.csv
      - name: Bootstrap comparison
        run: python src/news_veto_bootstrap.py results/news_v3_event_walkforward_filter_rows.csv --out results/news_v3_event_veto_bootstrap.csv --n-boot 10000
      - name: Validate bootstrap
        run: |
          python - <<'PY'
          import pandas as pd
          p = pd.read_csv('results/news_v3_event_veto_bootstrap.csv')
          required = {'symbol','n_all','n_keep','delta_mean','ci_low','ci_high'}
          if not required.issubset(p.columns):
              raise SystemExit('Invalid bootstrap schema')
          if p.empty or 'ALL' not in set(p.symbol):
              raise SystemExit('Missing ALL bootstrap row')
          if not (p['n_keep'] <= p['n_all']).all():
              raise SystemExit('Invalid keep counts')
          print('BOOTSTRAP VETO PASS')
          print(p.to_string(index=False))
          PY
      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-v3-event-veto-bootstrap
          path: market_rebound_model/results/news_v3_event_veto_bootstrap.csv
          if-no-files-found: error
