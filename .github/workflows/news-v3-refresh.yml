name: News V3 refresh from existing GKG raw

on:
  workflow_dispatch:

jobs:
  refresh:
    name: Rebuild V3 from existing raw news
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: market_rebound_model
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run V3 classifier tests
        run: |
          python -m pytest -q \
            tests/test_news_event_classifier.py \
            tests/test_news_event_diagnostics.py

      - name: Find latest successful historical V3 artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/news-v2-historical-backfill.yml/runs?status=success&per_page=20" \
            --jq '.workflow_runs[0].id')
          test -n "$run_id" && test "$run_id" != "null"
          artifact_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="news-v3-event-aware-historical-final") | .id' | head -n 1)
          test -n "$artifact_id"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "Using successful historical artifact $artifact_id from run $run_id"

      - name: Download existing raw GKG artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p results/imported
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/news-v3-history.zip
          unzip -q /tmp/news-v3-history.zip -d results/imported
          raw=$(find results/imported -type f -name 'news_v2_full_raw.csv' -print -quit)
          test -n "$raw"
          cp "$raw" results/news_v2_full_raw.csv

      - name: Rebuild daily event-aware features
        run: |
          python - <<'PY'
          import pandas as pd
          from src.gkg_candidate_backfill import aggregate_daily

          raw = pd.read_csv('results/news_v2_full_raw.csv')
          daily = aggregate_daily(raw)
          if daily.empty:
              raise SystemExit('Rebuilt V3 daily dataset is empty')
          event_cols = [
              'event_earnings_share','event_guidance_share','event_analyst_share',
              'event_regulatory_share','event_ma_share','event_product_share',
              'event_macro_share','event_other_share'
          ]
          present = [c for c in event_cols if c in daily.columns]
          if not present:
              raise SystemExit('No event-share columns were rebuilt')
          if not (daily[present].sum(axis=1) > 0).any():
              raise SystemExit('Event-aware rebuild produced only zero event shares')
          daily.to_csv('results/news_v3_full_daily.csv', index=False)
          print(f'RAW={len(raw)} DAILY={len(daily)}')
          print(daily[present].sum().sort_values(ascending=False).to_string())
          PY

      - name: Run V1 vs V3 event-aware walk-forward
        run: |
          python src/news_v2_backtest.py \
            results/news_v3_full_daily.csv \
            --out results/news_v3_event_aware_backtest.csv

      - name: Run OOS event-family diagnostics
        run: |
          python src/news_event_diagnostics.py \
            results/latest_news_v3_oos_predictions.csv \
            --out results/news_v3_event_diagnostics.csv

      - name: Validate V3 refresh
        run: |
          python - <<'PY'
          import pandas as pd

          backtest = pd.read_csv('results/news_v3_event_aware_backtest.csv')
          diag = pd.read_csv('results/news_v3_event_diagnostics.csv')
          required = {'set','n','mean_next_ret','median_next_ret','hit_2pct','hit_3pct','hit_5pct','mean_next_high'}
          if not required.issubset(backtest.columns):
              raise SystemExit('Backtest report schema invalid')
          v2 = backtest[backtest['set'].astype(str).str.contains(r'V2 \+ news', regex=True)]
          v3 = backtest[backtest['set'].astype(str).str.contains(r'V3 event-aware', regex=True)]
          if v2.empty or v3.empty or (v3['n'].fillna(0) <= 0).all():
              raise SystemExit('Missing valid V2/V3 comparison rows')
          if diag.empty or diag[diag['condition'] == 'primary_event'].empty:
              raise SystemExit('No primary-event diagnostics')
          print('NEWS V3 REFRESH PASS')
          print(backtest.to_string(index=False))
          print(diag.to_string(index=False))
          PY

      - name: Upload refreshed V3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: news-v3-refresh-final
          path: |
            market_rebound_model/results/news_v2_full_raw.csv
            market_rebound_model/results/news_v3_full_daily.csv
            market_rebound_model/results/news_v3_event_aware_backtest.csv
            market_rebound_model/results/latest_news_v3_oos_predictions.csv
            market_rebound_model/results/news_v3_event_diagnostics.csv
          if-no-files-found: error
