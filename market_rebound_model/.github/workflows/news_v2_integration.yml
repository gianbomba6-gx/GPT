name: News V2 integration

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_rebound_model/src/news_v2_backtest.py'
      - 'market_rebound_model/src/gkg_candidate_backfill.py'
      - 'market_rebound_model/src/news_event_classifier.py'
      - 'market_rebound_model/src/rebound_model.py'
      - 'market_rebound_model/rebound_model.py'
      - 'market_rebound_model/live_alert.py'
      - 'market_rebound_model/tests/test_news_v2_integration.py'
      - 'market_rebound_model/.github/workflows/news_v2_integration.yml'
      - 'market_rebound_model/requirements.txt'

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market_rebound_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_gdelt_news.py tests/test_gkg_historical_news.py tests/test_news_event_classifier.py tests/test_news_v2_integration.py
      - name: Import smoke
        run: python - <<'PY'
          from src.news_v2_backtest import merge_news, load_news, pooled_walk_forward
          from src.gkg_candidate_backfill import close_utc, filter_at_close, aggregate_daily
          print('NEWS V2 IMPORT SMOKE PASS')
          print('US close UTC:', close_utc(__import__('datetime').date(2026,8,19), 'NVDA'))
        PY
